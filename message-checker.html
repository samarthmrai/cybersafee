<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberSafe - Message Checker</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #58a6ff;
      --danger: #f85149;
      --warning: #d29922;
      --success: #3fb950;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .nav-back {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .nav-back:hover {
      text-decoration: underline;
    }

    h1 {
      color: var(--heading);
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #8b949e;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      background: #0d1117;
      color: var(--heading);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 1rem;
    }

    button {
      background: var(--accent);
      color: #0d1117;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.clear-btn {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .result-box {
      margin-top: 2rem;
      padding: 1.25rem;
      border-radius: 8px;
      display: none;
    }

    .result-box.danger {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--danger);
      display: block;
    }

    .result-box.warning {
      background: rgba(210, 153, 34, 0.1);
      border: 1px solid var(--warning);
      display: block;
    }

    .result-box.safe {
      background: rgba(63, 185, 80, 0.1);
      border: 1px solid var(--success);
      display: block;
    }

    .status-badge {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .danger .status-badge { color: var(--danger); }
    .warning .status-badge { color: var(--warning); }
    .safe .status-badge { color: var(--success); }

    ul.reasons-list {
      margin-left: 1.2rem;
      margin-top: 0.5rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="nav-back">&larr; Back to CyberSafe Home</a>
    <h1>Scam & Phishing Message Checker</h1>
    <p class="subtitle">Paste any suspicious SMS, WhatsApp message, or email text to verify if it is safe.</p>

    <textarea id="messageInput" placeholder="Paste your message here (e.g., 'Dear user, your electricity will be disconnected tonight. Update KYC immediately at http://...')."></textarea>

    <div class="actions">
      <button onclick="checkMessage()">Analyze Message</button>
      <button class="clear-btn" onclick="clearAll()">Clear</button>
    </div>

    <div id="resultBox" class="result-box">
      <div id="statusBadge" class="status-badge"></div>
      <p id="analysisSummary"></p>
      <ul id="reasonsList" class="reasons-list"></ul>
    </div>
  </div>

  <script>
    const scamIndicators = [
      { regex: /otp|one\s*time\s*password|verification\s*code/i, reason: "Mentions OTP/passwords. Legitimate services will never ask for your OTP." },
      { regex: /kyc|pan\s*card|aadhaar|account\s*(blocked|suspended|freeze)/i, reason: "Claims your bank account or SIM card is blocked/needs immediate KYC." },
      { regex: /electricity\s*(bill)?|power\s*cut|disconnected\s*(tonight|today)/i, reason: "Urgent electricity bill or power disconnection scam." },
      { regex: /lottery|won|crore|lakh|prize|jackpot|free\s*gift/i, reason: "Promises free money, fake lottery winnings, or unexpected cash rewards." },
      { regex: /bit\.ly|tinyurl|\.xyz|\.top|\.apk|http:\/\/|goo\.gl|t\.me/i, reason: "Contains suspicious shortened links, unverified domains, or downloadable .apk files." },
      { regex: /urgent|immediately|act\s*now|within\s*24\s*hours|last\s*day/i, reason: "Applies pressure tactics to make you act without verifying." }
    ];

    function checkMessage() {
      const text = document.getElementById('messageInput').value.trim();
      const resultBox = document.getElementById('resultBox');
      const statusBadge = document.getElementById('statusBadge');
      const analysisSummary = document.getElementById('analysisSummary');
      const reasonsList = document.getElementById('reasonsList');

      if (!text) {
        alert("Please enter or paste a message first!");
        return;
      }

      const flags = [];
      scamIndicators.forEach(indicator => {
        if (indicator.regex.test(text)) {
          flags.push(indicator.reason);
        }
      });

      reasonsList.innerHTML = '';
      resultBox.className = 'result-box';

      if (flags.length >= 2) {
        resultBox.classList.add('danger');
        statusBadge.textContent = "High Risk: Scam / Phishing Message!";
        analysisSummary.textContent = "Warning! This message shows dangerous fraud indicators:";
        flags.forEach(flag => {
          const li = document.createElement('li');
          li.textContent = flag;
          reasonsList.appendChild(li);
        });
      } else if (flags.length === 1) {
        resultBox.classList.add('warning');
        statusBadge.textContent = "Caution: Potentially Suspicious";
        analysisSummary.textContent = "This message contains 1 warning sign:";
        const li = document.createElement('li');
        li.textContent = flags[0];
        reasonsList.appendChild(li);
      } else {
        resultBox.classList.add('safe');
        statusBadge.textContent = "Appears Safe";
        analysisSummary.textContent = "No standard scam patterns or phishing threats detected. Never share your passwords or OTPs with anyone.";
      }
    }

    function clearAll() {
      document.getElementById('messageInput').value = '';
      document.getElementById('resultBox').style.display = 'none';
    }
  </script>
</body>
</html>
